<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MTG Proxy Wizard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #050505; --header-bg: rgba(19, 21, 26, 0.8);
            --card-bg: #13151a; --accent: #ff5d01;
            --accent-gradient: linear-gradient(45deg, #ff5d01, #da00ff);
            --text: #ffffff; --text-muted: #9ca3af; --border: rgba(255, 255, 255, 0.1);
            --input-bg: #0b0d11;
        }
        [data-theme="light"] {
            --bg: #f9fafb; --header-bg: rgba(255, 255, 255, 0.8);
            --card-bg: #ffffff; --text: #111827; --text-muted: #6b7280;
            --border: rgba(0, 0, 0, 0.1); --input-bg: #f3f4f6;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; transition: 0.3s; }
        header { padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.4rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .theme-toggle { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }

        .controls-container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; }
        .box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        textarea { width: 100%; height: 140px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 0.6rem; color: var(--text); padding: 0.8rem; font-family: monospace; resize: vertical; box-sizing: border-box; outline: none; font-size: 0.8rem; }
        input[type="text"] { width: 100%; padding: 0.8rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 0.6rem; color: var(--text); box-sizing: border-box; outline: none; }
        
        .btn { padding: 0.8rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 0.8rem; }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-accent { background: var(--accent-gradient); color: white; }
        
        .card-grid { max-width: 1200px; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .card-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.6rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .card-item img { width: 100%; border-radius: 0.5rem; margin-bottom: 0.6rem; background: #222; min-height: 230px; }
        
        .card-actions { display: flex; gap: 0.4rem; justify-content: center; }
        .btn-round { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
        .btn-round:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-art { flex-grow: 1; height: 32px; border-radius: 16px; font-size: 0.65rem; font-weight: bold; background: var(--text); color: var(--bg); border: none; cursor: pointer; }

        #artModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 3% auto; padding: 2rem; width: 90%; max-width: 900px; border-radius: 1rem; border: 1px solid var(--border); }
        .art-selection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .art-option-container { position: relative; cursor: pointer; transition: 0.2s; border-radius: 0.5rem; border: 2px solid transparent; overflow: hidden; }
        .art-option-container:hover { border-color: var(--accent); transform: translateY(-3px); }
        .art-option-container img { width: 100%; display: block; }
        .apply-all-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent); color: white; font-size: 0.55rem; font-weight: bold; padding: 4px; text-align: center; transform: translateY(100%); transition: 0.2s; }
        .art-option-container:hover .apply-all-overlay { transform: translateY(0); }

        #status-bar { position: fixed; bottom: 1rem; right: 1rem; left: 1rem; max-width: 420px; margin-left: auto; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.9rem 1.2rem; border-radius: 1rem; display: none; z-index: 1100; font-weight: bold; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        #status-label { font-size: 0.75rem; margin-bottom: 0.5rem; display: block; }
        #status-track { width: 100%; height: 8px; background: var(--input-bg); border-radius: 1rem; overflow: hidden; }
        #status-fill { height: 100%; width: 0%; background: var(--accent-gradient); transition: width 0.15s ease; }
    </style>
</head>
<body>

<header>
    <h1>MTG PROXY WIZARD 🧙‍♂️</h1>
    <div style="display:flex; gap: 0.6rem;">
        <button class="theme-toggle" onclick="toggleLang()">
            <span id="lang-icon">🇬🇧</span> <span id="lang-text">English</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
        </button>
    </div>
</header>

<div class="controls-container">
    <div class="box">
        <label style="font-size: 0.7rem; color: var(--text-muted);">DECKLISTE ODER SCRYFALL-LINKS</label>
        <textarea id="listInput" placeholder="4 Sol Ring&#10;1 https://scryfall.com/card/mh2/261/urzas-saga"></textarea>
        <button class="btn btn-primary" onclick="loadCards()">Liste laden</button>
    </div>
    <div class="box">
        <input type="text" id="fileNameInput" placeholder="Dateiname (Optional)">
        <select id="pageSize" style="padding: 0.8rem; border-radius: 0.6rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--border);">
            <option value="5x7">Foto Papier (5x7")</option>
            <option value="a4">Standard A4</option>
        </select>
        <button id="dlBtn" class="btn btn-accent" onclick="generatePDF()">PDF Generieren</button>
    </div>
</div>

<div class="card-grid" id="cardGrid"></div>

<div id="artModal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer;" onclick="closeModal()">✕</span>
        <h2 id="modalTitle" style="margin-top:0;">Variante wählen</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Klick: Einzeln | <b>ALT + Klick</b>: Alle gleichen Karten</p>
        <div id="artSelectionGrid" class="art-selection-grid"></div>
    </div>
</div>

<div id="status-bar">
    <span id="status-label">Verarbeite...</span>
    <div id="status-track"><div id="status-fill"></div></div>
</div>

<script>
    let cardData = [];
    let currentEditIndex = null;
    let preferredArts = JSON.parse(localStorage.getItem('mtg_preferred_arts') || '{}');
    let currentLang = localStorage.getItem('mtg_lang') || 'en';

    // On Load: Deckliste wiederherstellen
    window.onload = () => {
        const savedList = localStorage.getItem('mtg_last_decklist');
        if (savedList) {
            document.getElementById('listInput').value = savedList;
        }
        updateLangUI();
    };

    function updateLangUI() {
        const icon = document.getElementById('lang-icon');
        const text = document.getElementById('lang-text');
        if (currentLang === 'de') {
            icon.innerText = '🇩🇪'; text.innerText = 'Deutsch';
        } else {
            icon.innerText = '🇬🇧'; text.innerText = 'English';
        }
    }

    function toggleLang() {
        currentLang = currentLang === 'de' ? 'en' : 'de';
        localStorage.setItem('mtg_lang', currentLang);
        updateLangUI();
        if (cardData.length) loadCards();
    }

    // ==================================================================
    // Scryfall-API-Schicht: Rate-Limiting, Caching und Retry
    // ------------------------------------------------------------------
    // Scryfall erlaubt hart max. 10 Requests/Sekunde. Bei Überschreitung
    // kommt HTTP 429 (30 Sekunden Sperre), bei wiederholtem Verstoß droht
    // ein dauerhafter Bann. Da 429-Antworten keine CORS-Header tragen,
    // erscheinen sie im Browser irreführend als CORS-Fehler.
    // Deshalb: alle API-Aufrufe streng serialisiert mit Mindestabstand.
    // Bild-Downloads von *.scryfall.io haben KEIN Limit und laufen hier
    // bewusst nicht durch die Warteschlange.
    // ==================================================================
    const API_GAP = 120;         // ms Mindestabstand (< 10/s mit Sicherheitsmarge)
    const COLLECTION_GAP = 550;  // /cards/collection ist auf 2/s limitiert
    const CACHE_TTL = 24 * 60 * 60 * 1000; // Scryfall bittet um >=24h Caching

    let apiQueue = Promise.resolve();
    let lastApiCall = 0;

    const memCache = new Map();
    const inFlight = new Map();

    function cacheKey(url, body) { return body ? url + '|' + body : url; }

    function cacheGet(key) {
        if (memCache.has(key)) return memCache.get(key);
        try {
            const raw = localStorage.getItem('sf_' + key);
            if (raw) {
                const e = JSON.parse(raw);
                if (Date.now() - e.t < CACHE_TTL) { memCache.set(key, e.v); return e.v; }
                localStorage.removeItem('sf_' + key);
            }
        } catch (e) { /* defektes Cache-Item ignorieren */ }
        return null;
    }

    function cacheSet(key, value) {
        memCache.set(key, value);
        try {
            const s = JSON.stringify({ t: Date.now(), v: value });
            // Grosse Batch-Antworten sprengen die localStorage-Quota (ca. 5 MB).
            // Sie bleiben im Speicher-Cache, werden aber nicht persistiert.
            if (s.length > 100000) return;
            localStorage.setItem('sf_' + key, s);
        } catch (e) {
            // Quota voll: alte Scryfall-Einträge verwerfen, Deckliste behalten
            try {
                Object.keys(localStorage).filter(k => k.startsWith('sf_')).forEach(k => localStorage.removeItem(k));
            } catch (e2) { /* aufgeben, In-Memory-Cache reicht */ }
        }
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Serialisierter, rate-limitierter Fetch mit Backoff bei 429.
    function scryfallFetch(url, { body = null, gap = API_GAP, retries = 3 } = {}) {
        const key = cacheKey(url, body);
        const hit = cacheGet(key);
        if (hit) return Promise.resolve(hit);
        // Identische Anfrage läuft bereits -> anhängen statt doppelt abfragen
        if (inFlight.has(key)) return inFlight.get(key);

        const run = async () => {
            for (let attempt = 0; ; attempt++) {
                const wait = lastApiCall + gap - Date.now();
                if (wait > 0) await sleep(wait);
                lastApiCall = Date.now();
                try {
                    const opts = { headers: { 'Accept': 'application/json' } };
                    if (body) {
                        opts.method = 'POST';
                        opts.body = body;
                        opts.headers['Content-Type'] = 'application/json';
                    }
                    const res = await fetch(url, opts);
                    if (res.status === 429) throw new Error('rate_limited');
                    if (res.status === 404) return null;   // Karte existiert nicht
                    if (!res.ok && res.status >= 500) throw new Error('server_' + res.status);
                    const json = await res.json();
                    if (json.object === 'error' && json.status === 429) throw new Error('rate_limited');
                    cacheSet(key, json);
                    return json;
                } catch (e) {
                    if (attempt >= retries) return null;
                    // 429 sperrt laut Scryfall 30s -> deutlich zurückfahren
                    const backoff = e.message === 'rate_limited' ? 5000 * (attempt + 1) : 700 * (attempt + 1);
                    setLoadStatus(`Scryfall-Limit erreicht, warte ${Math.round(backoff / 1000)}s...`);
                    await sleep(backoff);
                }
            }
        };

        apiQueue = apiQueue.then(run, run);
        const p = apiQueue.finally(() => inFlight.delete(key));
        inFlight.set(key, p);
        return p;
    }

    function setLoadStatus(text) {
        const grid = document.getElementById('cardGrid');
        const p = grid.querySelector('.load-status');
        if (p) p.innerText = text;
    }

    // Versucht, eine Karte (per set/collector_number) in der gewünschten Sprache zu laden.
    // Fällt bei fehlender Übersetzung auf die Originalkarte zurück.
    // Sucht über ALLE Editionen der Karte (nicht nur den zuletzt gefundenen Druck),
    // da nicht jeder Druck (z.B. Secret Lair/Sonderdrucke) in jeder Sprache existiert.
    async function localize(data, lang) {
        if (!data || data.lang === lang || !data.name) return data;
        const isToken = data.layout === 'token';
        const q = `!"${data.name}" lang:${lang}${isToken ? ' is:token' : ''}`;
        const j = await scryfallFetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&order=released&dir=desc`);
        const t = j && j.data && j.data[0];
        if (t && (t.image_uris || t.card_faces)) return t;
        return data; // keine Übersetzung gefunden -> Original behalten
    }

    function toggleTheme() {
        const h = document.documentElement;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (h.getAttribute('data-theme') === 'dark') {
            h.setAttribute('data-theme', 'light'); icon.innerText = '☀️'; text.innerText = 'Light Mode';
        } else {
            h.setAttribute('data-theme', 'dark'); icon.innerText = '🌙'; text.innerText = 'Dark Mode';
        }
    }

    async function resolveInput(input) {
        input = input.trim();
        if (input.includes('scryfall.com/card/')) {
            const parts = input.split('/card/')[1].split('/');
            return await scryfallFetch(`https://api.scryfall.com/cards/${parts[0]}/${parts[1]}`);
        }
        if (input.toLowerCase().includes('token')) {
            const clean = input.toLowerCase().replace('token', '').trim();
            const d = await scryfallFetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(clean)}+is%3Atoken`);
            return d && d.data ? d.data[0] : null;
        }
        // Fuzzy-Suche als Rückfallebene, wenn der Batch-Abgleich den Namen nicht kannte
        const data = await scryfallFetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(input)}`);
        return data && data.id ? data : null;
    }

    // Löst viele Kartennamen mit möglichst wenigen Requests auf.
    // /cards/collection nimmt bis zu 75 Karten pro Request entgegen -
    // statt 75 Einzelabfragen (die zwangsläufig ins Rate-Limit laufen).
    async function resolveBatch(entries, onProgress) {
        const result = new Map();   // content -> Kartendaten
        const viaCollection = [];   // Einträge, die der Batch abdeckt

        for (const content of entries) {
            if (preferredArts[content]) {
                viaCollection.push({ content, ident: { id: preferredArts[content] } });
            } else if (content.includes('scryfall.com/card/')) {
                const p = content.split('/card/')[1].split('/');
                viaCollection.push({ content, ident: { set: p[0], collector_number: p[1] } });
            } else if (!content.toLowerCase().includes('token')) {
                viaCollection.push({ content, ident: { name: content } });
            }
        }

        for (let i = 0; i < viaCollection.length; i += 75) {
            const chunk = viaCollection.slice(i, i + 75);
            onProgress(`Suche Karten ${i + 1}-${i + chunk.length} von ${viaCollection.length}...`);
            const body = JSON.stringify({ identifiers: chunk.map(c => c.ident) });
            const res = await scryfallFetch('https://api.scryfall.com/cards/collection',
                                            { body, gap: COLLECTION_GAP });
            if (!res || !res.data) continue;
            // Reihenfolge ist nicht verlässlich, wenn Karten fehlen -> per Name/ID zuordnen
            for (const card of res.data) {
                const match = chunk.find(c =>
                    (c.ident.id && c.ident.id === card.id) ||
                    (c.ident.collector_number && c.ident.set === card.set &&
                     c.ident.collector_number === card.collector_number) ||
                    (c.ident.name && c.ident.name.toLowerCase() === card.name.toLowerCase()) ||
                    (c.ident.name && card.name.toLowerCase().startsWith(c.ident.name.toLowerCase() + ' //')));
                if (match && !result.has(match.content)) result.set(match.content, card);
            }
        }

        // Nicht gefundene Namen (Tippfehler, Tokens, Sonderfälle) einzeln nachschlagen
        const missing = entries.filter(c => !result.has(c));
        for (let i = 0; i < missing.length; i++) {
            onProgress(`Einzelsuche ${i + 1}/${missing.length}: ${missing[i]}`);
            const d = await resolveInput(missing[i]);
            if (d) result.set(missing[i], d);
        }
        return result;
    }

    async function loadCards() {
        const input = document.getElementById('listInput').value;
        // Liste im localStorage speichern
        localStorage.setItem('mtg_last_decklist', input);

        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '<p class="load-status">Lade Karten...</p>';
        cardData = [];

        const lines = input.split('\n').filter(l => l.trim());
        const parsed = lines.map(line => {
            const m = line.trim().match(/^(\d+)\s+(.*)$/);
            return m ? { count: parseInt(m[1]), content: m[2] } : { count: 1, content: line.trim() };
        });

        // Gleiche Karte mehrfach in der Liste -> nur einmal abfragen
        const unique = [...new Set(parsed.map(p => p.content))];
        const onProgress = t => setLoadStatus(t);

        let resolved;
        try {
            resolved = await resolveBatch(unique, onProgress);
        } catch (e) {
            grid.innerHTML = `<p>Fehler beim Laden: ${e.message}</p>`;
            return;
        }

        // Übersetzung nur nötig, wenn nicht Englisch (Scryfall liefert per Default en)
        if (currentLang !== 'en') {
            let n = 0;
            for (const [content, data] of resolved) {
                onProgress(`Übersetze ${++n}/${resolved.size}: ${data.name}`);
                resolved.set(content, await localize(data, currentLang));
            }
        }

        const failed = [];
        for (const { count, content } of parsed) {
            const data = resolved.get(content);
            if (!data || !(data.image_uris || data.card_faces)) { failed.push(content); continue; }
            const uris = data.image_uris || data.card_faces[0].image_uris;
            for (let i = 0; i < count; i++) {
                cardData.push({
                    id: data.id,
                    name: data.name,
                    originalSearchName: content,
                    image: uris.normal,
                    highResImage: uris.png || uris.large || uris.normal,
                    isToken: data.layout === 'token'
                });
            }
        }

        renderPreview();
        if (failed.length) {
            const warn = document.createElement('p');
            warn.style.cssText = 'color:#ff5d01;font-size:0.8rem;grid-column:1/-1;';
            warn.innerText = `Nicht gefunden: ${[...new Set(failed)].join(', ')}`;
            grid.prepend(warn);
        }
    }

    function renderPreview() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = cardData.length ? '' : '<p>Keine Karten in der Vorschau.</p>';
        cardData.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <img src="${card.image}" id="main-img-${i}">
                <div class="card-actions">
                    <button class="btn-round" onclick="removeCard(${i})">−</button>
                    <button class="btn-art" onclick="openArtPicker(${i})">VARIANTE</button>
                    <button class="btn-round" onclick="duplicateCard(${i})">+</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function duplicateCard(i) {
        const newCard = JSON.parse(JSON.stringify(cardData[i]));
        cardData.splice(i + 1, 0, newCard);
        renderPreview();
    }

    function removeCard(i) {
        cardData.splice(i, 1);
        renderPreview();
    }

    async function openArtPicker(index) {
        currentEditIndex = index;
        const card = cardData[index];
        const modal = document.getElementById('artModal');
        const artGrid = document.getElementById('artSelectionGrid');
        document.getElementById('modalTitle').innerText = card.name;
        modal.style.display = "block";
        artGrid.innerHTML = "Lade Varianten...";

        try {
            const langFilter = ` lang:${currentLang}`;
            const q = card.isToken ? `!"${card.name}" is:token${langFilter}` : `!"${card.name}" unique:prints${langFilter}`;
            const data = await scryfallFetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}`);
            artGrid.innerHTML = "";
            if (!data || !data.data || !data.data.length) {
                artGrid.innerHTML = `Keine Varianten in dieser Sprache (${currentLang}) gefunden.`;
                return;
            }
            data.data.forEach(print => {
                const uris = print.image_uris || print.card_faces[0].image_uris;
                const imgUrl = uris.normal;
                const hiResUrl = uris.png || uris.large || uris.normal;
                const container = document.createElement('div');
                container.className = 'art-option-container';
                container.innerHTML = `<img src="${imgUrl}"><div class="apply-all-overlay">ALT+KLICK: Alle</div>`;
                container.onclick = (e) => {
                    if (e.altKey) applyToAll(card.name, imgUrl, hiResUrl, print.id, card.originalSearchName);
                    else selectArt(imgUrl, hiResUrl, print.id, card.originalSearchName);
                };
                artGrid.appendChild(container);
            });
        } catch (e) { artGrid.innerHTML = "Fehler beim Laden."; }
    }

    function selectArt(url, hiResUrl, id, originalName) {
        cardData[currentEditIndex].image = url;
        cardData[currentEditIndex].highResImage = hiResUrl;
        cardData[currentEditIndex].id = id;
        preferredArts[originalName] = id;
        localStorage.setItem('mtg_preferred_arts', JSON.stringify(preferredArts));
        document.getElementById(`main-img-${currentEditIndex}`).src = url;
        closeModal();
    }

    function applyToAll(name, imageUrl, hiResUrl, id, originalName) {
        cardData.forEach(card => {
            if (card.name === name) {
                card.image = imageUrl;
                card.highResImage = hiResUrl;
                card.id = id;
            }
        });
        preferredArts[originalName] = id;
        localStorage.setItem('mtg_preferred_arts', JSON.stringify(preferredArts));
        renderPreview();
        closeModal();
    }

    function closeModal() { document.getElementById('artModal').style.display = "none"; }

    async function generatePDF() {
        if (cardData.length === 0) return;
        const status = document.getElementById('status-bar');
        const label = document.getElementById('status-label');
        const fill = document.getElementById('status-fill');
        const btn = document.getElementById('dlBtn');
        status.style.display = "block";
        btn.disabled = true;
        fill.style.width = "0%";

        const setProgress = (done, total, text) => {
            fill.style.width = `${Math.round((done / total) * 100)}%`;
            label.innerText = text;
        };

        try {
            // ---- Phase 1: Alle Bilder in maximaler Qualität laden (dedupliziert) ----
            const urls = [...new Set(cardData.map(c => c.highResImage || c.image))];
            let loaded = 0, totalBytes = 0;
            setProgress(0, 1, `Lade ${urls.length} Bilder in Druckqualität...`);

            for (const url of urls) {
                let img = await fetchOriginalImage(url);
                if (!img) img = await fallbackImage(url);
                if (img) {
                    hiResCache.set(url, img);
                    totalBytes += img.bytes;
                }
                loaded++;
                setProgress(loaded, urls.length + cardData.length,
                    `Lade Bilder in Druckqualität: ${loaded}/${urls.length} (${(totalBytes/1048576).toFixed(1)} MB)`);
            }

            // ---- Phase 2: PDF zusammensetzen ----
            const { jsPDF } = window.jspdf;
            const format = document.getElementById('pageSize').value;
            const is5x7 = format === '5x7';

            // Einheit mm, damit die echte Kartengroesse exakt getroffen wird.
            // Offizielle Magic-Kartengroesse: 63 x 88 mm (2.5 x 3.5 Zoll waeren
            // 63.5 x 88.9 mm und damit spuerbar zu gross).
            const CARD_W = 63, CARD_H = 88;
            // 5x7 Zoll Fotopapier = 127 x 177.8 mm, A4 = 210 x 297 mm
            const pageW = is5x7 ? 127 : 210, pageH = is5x7 ? 177.8 : 297;

            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: is5x7 ? [pageW, pageH] : 'a4',
                compress: false
            });

            const w = CARD_W, h = CARD_H, cols = is5x7 ? 2 : 3, rows = is5x7 ? 2 : 3;
            const perPage = cols * rows;
            // Raster exakt auf der Seite zentrieren (sauberes Schneiden)
            const marginX = (pageW - cols * w) / 2;
            const marginY = (pageH - rows * h) / 2;

            for (let i = 0; i < cardData.length; i++) {
                const url = cardData[i].highResImage || cardData[i].image;
                const img = hiResCache.get(url);
                // DPI bezogen auf die tatsaechliche Druckbreite von 63 mm
                const dpi = img && img.width ? ` @ ${Math.round(img.width / (CARD_W / 25.4))} DPI` : '';
                setProgress(urls.length + i, urls.length + cardData.length,
                    `PDF wird erstellt: ${i + 1}/${cardData.length}${dpi} - ${cardData[i].name}`);
                // Rendering-Pause, damit der Fortschrittsbalken sichtbar mitlaeuft
                if (i % 3 === 0) await new Promise(r => requestAnimationFrame(r));

                if (i > 0 && i % perPage === 0) doc.addPage();
                const pIdx = i % perPage;
                const x = marginX + (pIdx % cols) * w;
                const y = marginY + Math.floor(pIdx / cols) * h;

                if (!img) continue;
                // alias = url -> identische Bilder werden nur einmal eingebettet.
                // 'SLOW' = verlustfreie zlib-Kompression (Stufe 9). Nachweislich
                // pixelidentisch zu 'NONE', aber ca. 4x kleinere Datei.
                doc.addImage(img.dataUrl, img.format, x, y, w, h, url, 'SLOW');
            }

            fill.style.width = "100%";
            label.innerText = "PDF wird gespeichert...";
            await new Promise(r => setTimeout(r, 50));

            // Timestamp Generierung (YYMMDD_HHMM)
            const now = new Date();
            const ts = now.toISOString().slice(2,10).replace(/-/g, '') + "_" +
                       now.getHours().toString().padStart(2, '0') +
                       now.getMinutes().toString().padStart(2, '0');

            const userTitle = document.getElementById('fileNameInput').value.trim() || 'Proxies';
            doc.save(`${ts}_${userTitle}.pdf`);
        } catch (e) {
            label.innerText = "Fehler: " + e.message;
            await new Promise(r => setTimeout(r, 3000));
        } finally {
            status.style.display = "none";
            btn.disabled = false;
        }
    }

    // Cache: identische Bilder (z.B. 4x dieselbe Karte) werden nur einmal geladen.
    const hiResCache = new Map();

    // Lädt die Original-Bilddatei byte-genau von Scryfall. Es findet KEINE
    // Neukodierung über ein Canvas statt - die PNG-Datei landet unverändert
    // im PDF, das ist die maximal mögliche Qualität.
    async function fetchOriginalImage(url) {
        if (hiResCache.has(url)) return hiResCache.get(url);
        try {
            // Kein Cache-Buster: die Scryfall-URLs sind bereits versioniert (?<timestamp>)
            const res = await fetch(url, { mode: 'cors', cache: 'force-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            const dataUrl = await new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = reject;
                fr.readAsDataURL(blob);
            });
            const result = {
                dataUrl,
                format: blob.type === 'image/png' ? 'PNG' : 'JPEG',
                bytes: blob.size,
                width: 0, height: 0
            };
            try {
                const bmp = await createImageBitmap(blob);
                result.width = bmp.width; result.height = bmp.height;
                bmp.close();
            } catch (e) { /* Dimensionen sind nur fuer die DPI-Anzeige noetig */ }
            hiResCache.set(url, result);
            return result;
        } catch (e) {
            return null;
        }
    }

    // Notfall-Fallback, falls fetch blockiert wird: über <img>+Canvas als PNG
    // (verlustfrei, aber mit Farbraum-Konvertierung durch den Browser).
    function fallbackImage(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth; c.height = img.naturalHeight;
                c.getContext('2d').drawImage(img, 0, 0);
                resolve({ dataUrl: c.toDataURL('image/png'), format: 'PNG', bytes: 0,
                          width: img.naturalWidth, height: img.naturalHeight });
            };
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }


</script>
</body>
</html>
