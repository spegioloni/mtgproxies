<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MTG Proxy Wizard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #050505; --header-bg: rgba(19, 21, 26, 0.8);
            --card-bg: #13151a; --accent: #ff5d01;
            --accent-gradient: linear-gradient(45deg, #ff5d01, #da00ff);
            --text: #ffffff; --text-muted: #9ca3af; --border: rgba(255, 255, 255, 0.1);
            --input-bg: #0b0d11;
        }
        [data-theme="light"] {
            --bg: #f9fafb; --header-bg: rgba(255, 255, 255, 0.8);
            --card-bg: #ffffff; --text: #111827; --text-muted: #6b7280;
            --border: rgba(0, 0, 0, 0.1); --input-bg: #f3f4f6;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; transition: 0.3s; }
        header { padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.4rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .theme-toggle { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }

        .controls-container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; }
        .box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        textarea { width: 100%; height: 140px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 0.6rem; color: var(--text); padding: 0.8rem; font-family: monospace; resize: vertical; box-sizing: border-box; outline: none; font-size: 0.8rem; }
        input[type="text"] { width: 100%; padding: 0.8rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 0.6rem; color: var(--text); box-sizing: border-box; outline: none; }
        
        .btn { padding: 0.8rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 0.8rem; }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-accent { background: var(--accent-gradient); color: white; }
        
        .card-grid { max-width: 1200px; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .card-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.6rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .card-item img { width: 100%; border-radius: 0.5rem; margin-bottom: 0.6rem; background: #222; min-height: 230px; }
        
        .card-actions { display: flex; gap: 0.4rem; justify-content: center; }
        .btn-round { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
        .btn-round:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-art { flex-grow: 1; height: 32px; border-radius: 16px; font-size: 0.65rem; font-weight: bold; background: var(--text); color: var(--bg); border: none; cursor: pointer; }

        #artModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 3% auto; padding: 2rem; width: 90%; max-width: 900px; border-radius: 1rem; border: 1px solid var(--border); }
        .art-selection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .art-option-container { position: relative; cursor: pointer; transition: 0.2s; border-radius: 0.5rem; border: 2px solid transparent; overflow: hidden; }
        .art-option-container:hover { border-color: var(--accent); transform: translateY(-3px); }
        .art-option-container img { width: 100%; display: block; }
        .apply-all-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent); color: white; font-size: 0.55rem; font-weight: bold; padding: 4px; text-align: center; transform: translateY(100%); transition: 0.2s; }
        .art-option-container:hover .apply-all-overlay { transform: translateY(0); }

        #status-bar { position: fixed; bottom: 1rem; right: 1rem; left: 1rem; max-width: 420px; margin-left: auto; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.9rem 1.2rem; border-radius: 1rem; display: none; z-index: 1100; font-weight: bold; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        #status-label { font-size: 0.75rem; margin-bottom: 0.5rem; display: block; }
        #status-track { width: 100%; height: 8px; background: var(--input-bg); border-radius: 1rem; overflow: hidden; }
        #status-fill { height: 100%; width: 0%; background: var(--accent-gradient); transition: width 0.15s ease; }
    </style>
</head>
<body>

<header>
    <h1>MTG PROXY WIZARD 🧙‍♂️</h1>
    <div style="display:flex; gap: 0.6rem;">
        <button class="theme-toggle" onclick="toggleLang()">
            <span id="lang-icon">🇬🇧</span> <span id="lang-text">English</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
        </button>
    </div>
</header>

<div class="controls-container">
    <div class="box">
        <label style="font-size: 0.7rem; color: var(--text-muted);">DECKLISTE ODER SCRYFALL-LINKS</label>
        <textarea id="listInput" placeholder="4 Sol Ring&#10;1 https://scryfall.com/card/mh2/261/urzas-saga"></textarea>
        <button class="btn btn-primary" onclick="loadCards()">Liste laden</button>
    </div>
    <div class="box">
        <input type="text" id="fileNameInput" placeholder="Dateiname (Optional)">
        <select id="pageSize" style="padding: 0.8rem; border-radius: 0.6rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--border);">
            <option value="5x7">Foto Papier (5x7")</option>
            <option value="a4">Standard A4</option>
        </select>
        <select id="quality" style="padding: 0.8rem; border-radius: 0.6rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--border);">
            <option value="jpeg95">Hohe Qualität (JPEG 95%, kleine Datei)</option>
            <option value="lossless">Maximale Qualität (verlustfrei, sehr groß)</option>
        </select>
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.75rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="sharpFirst" checked style="cursor:pointer;">
            Schärfe vor Sprache (englisches Bild, wenn Übersetzung unscharf)
        </label>
        <button id="dlBtn" class="btn btn-accent" onclick="generatePDF()">PDF Generieren</button>
    </div>
</div>

<div class="card-grid" id="cardGrid"></div>

<div id="artModal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer;" onclick="closeModal()">✕</span>
        <h2 id="modalTitle" style="margin-top:0;">Variante wählen</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Klick: Einzeln | <b>ALT + Klick</b>: Alle gleichen Karten</p>
        <div id="artSelectionGrid" class="art-selection-grid"></div>
    </div>
</div>

<div id="status-bar">
    <span id="status-label">Verarbeite...</span>
    <div id="status-track"><div id="status-fill"></div></div>
</div>

<script>
    let cardData = [];
    let currentEditIndex = null;
    let preferredArts = JSON.parse(localStorage.getItem('mtg_preferred_arts') || '{}');
    let currentLang = localStorage.getItem('mtg_lang') || 'en';

    // On Load: Deckliste wiederherstellen
    window.onload = () => {
        const savedList = localStorage.getItem('mtg_last_decklist');
        if (savedList) {
            document.getElementById('listInput').value = savedList;
        }
        updateLangUI();
    };

    function updateLangUI() {
        const icon = document.getElementById('lang-icon');
        const text = document.getElementById('lang-text');
        if (currentLang === 'de') {
            icon.innerText = '🇩🇪'; text.innerText = 'Deutsch';
        } else {
            icon.innerText = '🇬🇧'; text.innerText = 'English';
        }
    }

    function toggleLang() {
        currentLang = currentLang === 'de' ? 'en' : 'de';
        localStorage.setItem('mtg_lang', currentLang);
        updateLangUI();
        if (cardData.length) loadCards();
    }

    // ==================================================================
    // Scryfall-API-Schicht: Rate-Limiting, Caching und Retry
    // ------------------------------------------------------------------
    // Scryfall erlaubt hart max. 10 Requests/Sekunde. Bei Überschreitung
    // kommt HTTP 429 (30 Sekunden Sperre), bei wiederholtem Verstoß droht
    // ein dauerhafter Bann. Da 429-Antworten keine CORS-Header tragen,
    // erscheinen sie im Browser irreführend als CORS-Fehler.
    // Deshalb: alle API-Aufrufe streng serialisiert mit Mindestabstand.
    // Bild-Downloads von *.scryfall.io haben KEIN Limit und laufen hier
    // bewusst nicht durch die Warteschlange.
    // ==================================================================
    const API_GAP = 120;         // ms Mindestabstand (< 10/s mit Sicherheitsmarge)
    const COLLECTION_GAP = 550;  // /cards/collection ist auf 2/s limitiert
    const CACHE_TTL = 24 * 60 * 60 * 1000; // Scryfall bittet um >=24h Caching

    let apiQueue = Promise.resolve();
    let lastApiCall = 0;

    const memCache = new Map();
    const inFlight = new Map();
    // Marker für "existiert nicht" - verhindert, dass erfolglose Suchen
    // (z.B. Karte ohne deutschen Druck) bei jedem Umschalten neu abgefragt werden.
    const NOT_FOUND = { __notFound: true };
    let rateLimitHits = 0;

    function cacheKey(url, body) { return body ? url + '|' + body : url; }

    function cacheGet(key) {
        if (memCache.has(key)) return memCache.get(key);
        try {
            const raw = localStorage.getItem('sf_' + key);
            if (raw) {
                const e = JSON.parse(raw);
                if (Date.now() - e.t < CACHE_TTL) { memCache.set(key, e.v); return e.v; }
                localStorage.removeItem('sf_' + key);
            }
        } catch (e) { /* defektes Cache-Item ignorieren */ }
        return null;
    }

    function cacheSet(key, value) {
        memCache.set(key, value);
        try {
            const s = JSON.stringify({ t: Date.now(), v: value });
            // Grosse Batch-Antworten sprengen die localStorage-Quota (ca. 5 MB).
            // Sie bleiben im Speicher-Cache, werden aber nicht persistiert.
            if (s.length > 100000) return;
            localStorage.setItem('sf_' + key, s);
        } catch (e) {
            // Quota voll: alte Scryfall-Einträge verwerfen, Deckliste behalten
            try {
                Object.keys(localStorage).filter(k => k.startsWith('sf_')).forEach(k => localStorage.removeItem(k));
            } catch (e2) { /* aufgeben, In-Memory-Cache reicht */ }
        }
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Serialisierter, rate-limitierter Fetch mit Backoff bei 429.
    function scryfallFetch(url, { body = null, gap = API_GAP, retries = 3 } = {}) {
        const key = cacheKey(url, body);
        const hit = cacheGet(key);
        if (hit) return Promise.resolve(hit.__notFound ? null : hit);
        // Identische Anfrage läuft bereits -> anhängen statt doppelt abfragen
        if (inFlight.has(key)) return inFlight.get(key);

        const run = async () => {
            for (let attempt = 0; ; attempt++) {
                const wait = lastApiCall + gap - Date.now();
                if (wait > 0) await sleep(wait);
                lastApiCall = Date.now();
                try {
                    const opts = { headers: { 'Accept': 'application/json' } };
                    if (body) {
                        opts.method = 'POST';
                        opts.body = body;
                        opts.headers['Content-Type'] = 'application/json';
                    }
                    const res = await fetch(url, opts);
                    if (res.status === 429) throw new Error('rate_limited');
                    if (res.status === 404) { cacheSet(key, NOT_FOUND); return null; }
                    if (!res.ok && res.status >= 500) throw new Error('server_' + res.status);
                    const json = await res.json();
                    if (json.object === 'error' && json.status === 429) throw new Error('rate_limited');
                    if (json.object === 'error') { cacheSet(key, NOT_FOUND); return null; }
                    cacheSet(key, json);
                    return json;
                } catch (e) {
                    const limited = e.message === 'rate_limited';
                    if (limited) rateLimitHits++;
                    if (attempt >= retries) return null;
                    // Ein 429 sperrt laut Scryfall den Zugriff fuer 30 Sekunden.
                    // Kuerzer zu warten verlaengert die Sperre nur.
                    const backoff = limited ? 31000 : 700 * (attempt + 1);
                    for (let s = Math.ceil(backoff / 1000); s > 0; s--) {
                        setLoadStatus(limited
                            ? `Scryfall-Limit erreicht - warte ${s}s (Sperre dauert 30s)...`
                            : `Netzwerkfehler - neuer Versuch in ${s}s...`);
                        await sleep(1000);
                    }
                }
            }
        };

        apiQueue = apiQueue.then(run, run);
        const p = apiQueue.finally(() => inFlight.delete(key));
        inFlight.set(key, p);
        return p;
    }

    // Misst die tatsächliche Bildschärfe als Varianz des Laplace-Operators auf
    // dem kleinen Vorschaubild (488x680, lädt schnell).
    //
    // Scryfalls `image_status` allein reicht dafür nicht: "Cavern of Souls" ist
    // als `lowres` markiert, erreicht aber 5242 und ist damit exakt so scharf
    // wie der englische Druck (5208) - ein Sprachwechsel wäre dort grundlos.
    // Umgekehrt ist der englische "Ugin" ebenfalls als `lowres` markiert, mit
    // 5274 aber völlig in Ordnung. Wirklich unscharf sind erst Werte unter
    // ~2500 (Boseiju DE: 493, Ugin DE: 975); alles Scharfe lag bei 5139-5612.
    const SHARP_MIN = 2500;
    const sharpCache = new Map();

    function measureSharpness(url) {
        if (sharpCache.has(url)) return sharpCache.get(url);
        const p = new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                try {
                    const c = document.createElement('canvas');
                    c.width = img.naturalWidth;
                    c.height = img.naturalHeight;
                    const ctx = c.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0);
                    const { data, width: w, height: h } = ctx.getImageData(0, 0, c.width, c.height);
                    const g = new Float64Array(w * h);
                    for (let i = 0; i < w * h; i++) {
                        g[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
                    }
                    let s = 0, s2 = 0, n = 0;
                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const i = y * w + x;
                            const L = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
                            s += L; s2 += L * L; n++;
                        }
                    }
                    resolve(s2 / n - (s / n) ** 2);
                } catch { resolve(null); }   // z.B. wenn das Canvas "tainted" ist
            };
            img.onerror = () => resolve(null);
            img.src = url;
        });
        sharpCache.set(url, p);
        return p;
    }

    // Sammelt ALLE Drucke der genannten Karten (nicht nur den ersten Treffer),
    // damit anschliessend der schärfste davon ausgewählt werden kann.
    async function collectPrints(chunk, prefix, byName) {
        const names = chunk.map(g => g.name.replace(/"/g, ''));
        const q = `${prefix}${names.map(n => `!"${n}"`).join(' or ')})`;
        let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&order=released&dir=desc`;
        let guard = 0;
        while (url && guard++ < 25) {
            const res = await scryfallFetch(url);
            if (!res || !res.data) break;
            for (const card of res.data) {
                if (!names.includes(card.name)) continue;
                const u = card.image_uris || (card.card_faces && card.card_faces[0].image_uris);
                if (!u || !u.normal) continue;
                if (!byName.has(card.name)) byName.set(card.name, []);
                byName.get(card.name).push(card);
            }
            url = res.has_more ? res.next_page : null;
        }
    }

    // Sucht für unscharfe Karten den schärfsten Druck DERSELBEN Sprache.
    //
    // Hintergrund: Für viele Karten existiert bei Scryfall kein einziger
    // deutscher Druck mit `image_status: highres_scan` - trotzdem ist unter den
    // vielen "lowres"-Drucken oft einer deutlich besser. Gemessen:
    //   Llanowar Elves   neuester (j25) 485  -> bester (dom) 2867   5.9x
    //   Smothering Tithe neuester (wot) 931  -> bester (rna) 5541   6.0x
    //   Eternal Witness  neuester (m3c) 1123 -> bester (cmr) 5392   4.8x
    // So bleibt der deutsche Kartentext erhalten UND das Bild wird scharf.
    // Sobald ein Druck über SHARP_MIN liegt, wird abgebrochen - das spart die
    // meisten Messungen, weil oft schon der erste Alternativdruck genügt.
    async function findSharperPrint(cards, lang, onProgress) {
        if (!cards.length) return new Map();

        const byName = new Map();
        const groups = cards.map(c => ({ name: c.d.name }));
        const seen = new Set();
        const list = groups.filter(g => !seen.has(g.name) && seen.add(g.name));
        const prefix = `lang:${lang} unique:prints (`;

        const MAX_QUERY = 950;
        const chunks = [];
        let cur = [], len = prefix.length + 1;
        for (const g of list) {
            const cost = g.name.length + 3 + (cur.length ? 4 : 0);
            if (cur.length && len + cost > MAX_QUERY) { chunks.push(cur); cur = []; len = prefix.length + 1; }
            cur.push(g); len += cost;
        }
        if (cur.length) chunks.push(cur);

        onProgress(`Suche schärfere Drucke für ${list.length} Karten...`);
        for (const chunk of chunks) await collectPrints(chunk, prefix, byName);

        const better = new Map();   // Kartenname -> besserer Druck
        let checked = 0, total = 0;
        const todo = [];
        for (const c of cards) {
            if (todo.some(t => t.name === c.d.name)) continue;
            const prints = (byName.get(c.d.name) || []).filter(p => p.id !== c.d.id).slice(0, 8);
            if (prints.length) { todo.push({ name: c.d.name, base: c.score || 0, prints }); total += prints.length; }
        }

        // Alle Kandidaten einer Karte parallel messen und das Maximum nehmen.
        // Ein früher Abbruch beim ersten "gut genug" wäre falsch: für
        // Smothering Tithe liegt der zweitbeste Druck bei 743, der beste bei
        // 1754 - gemessen auf dem grossen Bild, das im PDF landet.
        for (const t of todo) {
            const scored = await Promise.all(t.prints.map(async p => {
                const u = p.image_uris || (p.card_faces && p.card_faces[0].image_uris);
                if (!u || !u.normal) return null;
                return { p, v: await measureSharpness(u.normal) };
            }));
            checked += t.prints.length;
            onProgress(`Prüfe Druckqualität ${checked}/${total}...`);

            let best = null, bestScore = t.base;
            for (const s of scored) {
                if (s && s.v != null && s.v > bestScore) { bestScore = s.v; best = s.p; }
            }
            // Auch eine Verbesserung unterhalb der Schwelle mitnehmen, solange
            // sie deutlich ist - besser ein spürbar schärferer deutscher Druck
            // als gar keiner.
            if (best && bestScore > t.base * 1.3) {
                better.set(t.name, { print: best, score: bestScore });
            }
        }
        return better;
    }

    function setLoadStatus(text) {
        const grid = document.getElementById('cardGrid');
        const p = grid.querySelector('.load-status');
        if (p) p.innerText = text;
    }

    // Führt eine gebündelte ODER-Suche aus und trägt die Treffer in `found` ein.
    // Schlägt die Anfrage fehl (z.B. wegen eines unerwartet abgelehnten Queries),
    // wird der Block halbiert und erneut versucht - bis hinunter zur Einzelsuche.
    // So kostet ein Fehlschlag nur wenige Zusatzanfragen statt 50.
    async function runQuery(chunk, prefix, found) {
        const names = chunk.map(g => g.name.replace(/"/g, ''));
        const q = `${prefix}${names.map(n => `!"${n}"`).join(' or ')})`;
        let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&order=released&dir=desc`;

        let any = false, guard = 0;
        while (url && guard++ < 15) {
            const res = await scryfallFetch(url);
            if (!res || !res.data) break;
            any = true;
            for (const card of res.data) {
                // Exakter Namensabgleich: die ODER-Suche liefert z.B. auch
                // Split-Karten wie "Emeritus of Conflict // Lightning Bolt"
                if (!found.has(card.name) && names.includes(card.name) &&
                    (card.image_uris || card.card_faces)) {
                    found.set(card.name, card);
                }
            }
            url = res.has_more ? res.next_page : null;
        }

        // Kein einziges Ergebnis bei mehreren Namen -> Query wurde abgelehnt.
        // (Bei einem einzelnen Namen heisst es schlicht: keine Übersetzung.)
        if (!any && chunk.length > 1) {
            const mid = Math.ceil(chunk.length / 2);
            await runQuery(chunk.slice(0, mid), prefix, found);
            await runQuery(chunk.slice(mid), prefix, found);
        }
    }

    // Zerlegt eine Namensliste in Blöcke unter dem 1024-Zeichen-Limit und
    // setzt pro Block eine gebündelte Suche ab.
    async function runPass(list, prefix, found, onProgress, label) {
        // Scryfall schneidet Suchanfragen hart bei 1024 Zeichen ab. Die
        // abgeschnittene Query verliert ihre schliessende Klammer und wird
        // mit "unclosed parentheses" (HTTP 400) abgelehnt. Nachgemessen:
        // 1024 Zeichen funktionieren, 1025 nicht. Mit Sicherheitsmarge:
        const MAX_QUERY = 950;

        const chunks = [];
        let cur = [], len = prefix.length + 1;
        for (const g of list) {
            const cost = g.name.length + 3 + (cur.length ? 4 : 0); // !"name" + " or "
            if (cur.length && len + cost > MAX_QUERY) { chunks.push(cur); cur = []; len = prefix.length + 1; }
            cur.push(g); len += cost;
        }
        if (cur.length) chunks.push(cur);

        let done = 0;
        for (const chunk of chunks) {
            onProgress(`${label} ${done + 1}-${done + chunk.length} von ${list.length}...`);
            done += chunk.length;
            await runQuery(chunk, prefix, found);
        }
    }

    // Wählt Drucke für die Zielsprache - und zwar qualitätsbewusst.
    //
    // Scryfall kennzeichnet die Scanqualität je Druck über `image_status`.
    // Nachgemessen (Laplace-Varianz als Schärfemass, gleiche 745x1040 Pixel):
    //   highres_scan -> Median 2704
    //   lowres       -> Median 338   (Boseiju DE: 79 vs. Boseiju EN: 1358)
    // Beide liefern dieselbe Pixelzahl, aber "lowres" ist ein hochskalierter
    // Scan und im Druck sichtbar matschig. Eine Sortierung nur nach
    // Erscheinungsdatum wählt daher regelmässig unscharfe Bilder aus.
    //
    // Deshalb zwei Durchgänge:
    //   1. `is:highres` - nur scharf gescannte Drucke
    //   2. für alles, was übrig bleibt: beliebiger Druck der Zielsprache
    // Das kostet nur ~2 Requests mehr und wirkt auch für Englisch, wo es
    // unscharfe Standarddrucke gegen scharfe tauscht.
    //
    // Karten ohne Druck in der Zielsprache behalten das Original.
    // Rückgabe: Namen, für die es keine Übersetzung gibt.
    async function localizeBatch(resolved, lang, onProgress) {
        const byName = new Map();   // Kartenname -> Listeneinträge
        for (const [content, d] of resolved) {
            if (!d || !d.name) continue;
            // Vom Nutzer selbst gewählte Variante nie überschreiben
            if (preferredArts[content]) continue;
            // Bereits in Zielsprache UND scharf -> nichts zu verbessern
            if (d.lang === lang && d.image_status === 'highres_scan') continue;
            const key = (d.layout === 'token' ? 'T:' : 'C:') + d.name;
            if (!byName.has(key)) byName.set(key, { name: d.name, isToken: d.layout === 'token', contents: [] });
            byName.get(key).contents.push(content);
        }
        if (!byName.size) return [];

        const groups = [...byName.values()];
        const found = new Map();    // Name -> bester gefundener Druck

        // Tokens getrennt behandeln, sonst kollidieren sie mit echten Karten
        for (const isToken of [false, true]) {
            const list = groups.filter(g => g.isToken === isToken);
            if (!list.length) continue;
            const base = `lang:${lang}${isToken ? ' is:token' : ''}`;

            // Durchgang 1: ausschliesslich scharfe Scans
            await runPass(list, `${base} is:highres (`, found, onProgress, 'Suche scharfe Drucke');

            // Durchgang 2: Rest ohne Schärfefilter (besser übersetzt als gar nicht)
            const rest = list.filter(g => !found.has(g.name));
            if (rest.length) {
                await runPass(rest, `${base} (`, found, onProgress, 'Suche weitere Drucke');
            }
        }

        const untranslated = [];
        for (const g of groups) {
            const loc = found.get(g.name);
            // Nur übernehmen, wenn es die Karte nicht verschlechtert: ein
            // unscharfer Treffer darf einen bereits scharfen Druck nicht ersetzen.
            if (loc) {
                for (const c of g.contents) {
                    const old = resolved.get(c);
                    const downgrade = old && old.image_status === 'highres_scan' &&
                                      loc.image_status !== 'highres_scan' && old.lang === loc.lang;
                    if (!downgrade) resolved.set(c, loc);
                }
            } else if (!g.contents.some(c => { const d = resolved.get(c); return d && d.lang === lang; })) {
                untranslated.push(g.name);
            }
        }
        return untranslated;
    }

    function toggleTheme() {
        const h = document.documentElement;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (h.getAttribute('data-theme') === 'dark') {
            h.setAttribute('data-theme', 'light'); icon.innerText = '☀️'; text.innerText = 'Light Mode';
        } else {
            h.setAttribute('data-theme', 'dark'); icon.innerText = '🌙'; text.innerText = 'Dark Mode';
        }
    }

    async function resolveInput(input) {
        input = input.trim();
        if (input.includes('scryfall.com/card/')) {
            const parts = input.split('/card/')[1].split('/');
            return await scryfallFetch(`https://api.scryfall.com/cards/${parts[0]}/${parts[1]}`);
        }
        if (input.toLowerCase().includes('token')) {
            const clean = input.toLowerCase().replace('token', '').trim();
            const d = await scryfallFetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(clean)}+is%3Atoken`);
            return d && d.data ? d.data[0] : null;
        }
        // Fuzzy-Suche als Rückfallebene, wenn der Batch-Abgleich den Namen nicht kannte
        const data = await scryfallFetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(input)}`);
        return data && data.id ? data : null;
    }

    // Löst viele Kartennamen mit möglichst wenigen Requests auf.
    // /cards/collection nimmt bis zu 75 Karten pro Request entgegen -
    // statt 75 Einzelabfragen (die zwangsläufig ins Rate-Limit laufen).
    async function resolveBatch(entries, onProgress) {
        const result = new Map();   // content -> Kartendaten
        const viaCollection = [];   // Einträge, die der Batch abdeckt

        for (const content of entries) {
            if (preferredArts[content]) {
                viaCollection.push({ content, ident: { id: preferredArts[content] } });
            } else if (content.includes('scryfall.com/card/')) {
                const p = content.split('/card/')[1].split('/');
                viaCollection.push({ content, ident: { set: p[0], collector_number: p[1] } });
            } else if (!content.toLowerCase().includes('token')) {
                viaCollection.push({ content, ident: { name: content } });
            }
        }

        for (let i = 0; i < viaCollection.length; i += 75) {
            const chunk = viaCollection.slice(i, i + 75);
            onProgress(`Suche Karten ${i + 1}-${i + chunk.length} von ${viaCollection.length}...`);
            const body = JSON.stringify({ identifiers: chunk.map(c => c.ident) });
            const res = await scryfallFetch('https://api.scryfall.com/cards/collection',
                                            { body, gap: COLLECTION_GAP });
            if (!res || !res.data) continue;
            // Reihenfolge ist nicht verlässlich, wenn Karten fehlen -> per Name/ID zuordnen
            for (const card of res.data) {
                const match = chunk.find(c =>
                    (c.ident.id && c.ident.id === card.id) ||
                    (c.ident.collector_number && c.ident.set === card.set &&
                     c.ident.collector_number === card.collector_number) ||
                    (c.ident.name && c.ident.name.toLowerCase() === card.name.toLowerCase()) ||
                    (c.ident.name && card.name.toLowerCase().startsWith(c.ident.name.toLowerCase() + ' //')));
                if (match && !result.has(match.content)) result.set(match.content, card);
            }
        }

        // Nicht gefundene Namen (Tippfehler, Tokens, Sonderfälle) einzeln nachschlagen
        const missing = entries.filter(c => !result.has(c));
        for (let i = 0; i < missing.length; i++) {
            onProgress(`Einzelsuche ${i + 1}/${missing.length}: ${missing[i]}`);
            const d = await resolveInput(missing[i]);
            if (d) result.set(missing[i], d);
        }
        return result;
    }

    async function loadCards() {
        const input = document.getElementById('listInput').value;
        // Liste im localStorage speichern
        localStorage.setItem('mtg_last_decklist', input);

        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '<p class="load-status">Lade Karten...</p>';
        cardData = [];

        const lines = input.split('\n').filter(l => l.trim());
        const parsed = lines.map(line => {
            const m = line.trim().match(/^(\d+)\s+(.*)$/);
            return m ? { count: parseInt(m[1]), content: m[2] } : { count: 1, content: line.trim() };
        });

        // Gleiche Karte mehrfach in der Liste -> nur einmal abfragen
        const unique = [...new Set(parsed.map(p => p.content))];
        const onProgress = t => setLoadStatus(t);

        let resolved;
        try {
            resolved = await resolveBatch(unique, onProgress);
        } catch (e) {
            grid.innerHTML = `<p>Fehler beim Laden: ${e.message}</p>`;
            return;
        }

        // Auch für Englisch aufrufen: der Durchgang mit `is:highres` tauscht
        // unscharfe Standarddrucke gegen scharf gescannte.
        const original = new Map(resolved);   // Ausgangsdrucke für den Vergleich merken
        const untranslated = await localizeBatch(resolved, currentLang, onProgress);

        // Bleibt eine Übersetzung unscharf, obwohl der englische Ausgangsdruck
        // scharf ist, darf der Nutzer Druckqualität über die Sprache stellen.
        // Entschieden wird per Messung, nicht per `image_status` (siehe unten).
        const swapped = [], soft = [], upgraded = [], stillSoft = [];
        const sharpFirst = document.getElementById('sharpFirst').checked;

        // Nur verdächtige Karten messen - `highres_scan` ist verlässlich scharf.
        const suspects = [];
        for (const [content, d] of resolved) {
            if (!d || d.image_status === 'highres_scan') continue;
            if (preferredArts[content]) continue;   // selbst gewählte Variante respektieren
            const u = d.image_uris || (d.card_faces && d.card_faces[0].image_uris);
            if (u && u.normal) suspects.push({ content, d, url: u.normal });
        }

        if (suspects.length) {
            onProgress(`Prüfe Bildschärfe von ${suspects.length} Karten...`);
            // Begrenzte Parallelität: Bilder unterliegen keinem Rate-Limit,
            // aber 100 gleichzeitige Decodes blockieren den Browser.
            for (let i = 0; i < suspects.length; i += 6) {
                const batch = suspects.slice(i, i + 6);
                await Promise.all(batch.map(async s => { s.score = await measureSharpness(s.url); }));
                onProgress(`Prüfe Bildschärfe ${Math.min(i + 6, suspects.length)}/${suspects.length}...`);
            }

            for (const s of suspects) {
                if (s.score == null || s.score >= SHARP_MIN) continue;   // doch scharf genug
                stillSoft.push(s);
            }

            // Stufe 3: schärferen Druck in derselben Sprache suchen. Das erhält
            // den übersetzten Kartentext und behebt trotzdem die Unschärfe.
            const better = await findSharperPrint(stillSoft, currentLang, onProgress);

            for (const s of stillSoft) {
                const b = better.get(s.d.name);
                if (b) {
                    resolved.set(s.content, b.print);
                    upgraded.push(s.d.name);
                    if (b.score >= SHARP_MIN) continue;   // jetzt scharf genug
                    s.score = b.score;                    // sonst weiter als unscharf behandeln
                }

                const o = original.get(s.content);
                if (sharpFirst && o && o.lang !== s.d.lang) {
                    const ou = o.image_uris || (o.card_faces && o.card_faces[0].image_uris);
                    const ov = ou && ou.normal ? await measureSharpness(ou.normal) : null;
                    if (ov != null && ov > s.score * 1.5) {
                        resolved.set(s.content, o);
                        swapped.push(s.d.name);
                        const ui = upgraded.lastIndexOf(s.d.name);
                        if (ui >= 0) upgraded.splice(ui, 1);
                        continue;
                    }
                }
                soft.push(s.d.name);
            }
        }

        const failed = [];
        for (const { count, content } of parsed) {
            const data = resolved.get(content);
            if (!data || !(data.image_uris || data.card_faces)) { failed.push(content); continue; }
            const uris = data.image_uris || data.card_faces[0].image_uris;
            for (let i = 0; i < count; i++) {
                cardData.push({
                    id: data.id,
                    name: data.name,
                    originalSearchName: content,
                    image: uris.normal,
                    highResImage: uris.png || uris.large || uris.normal,
                    imageStatus: data.image_status,
                    isToken: data.layout === 'token'
                });
            }
        }

        renderPreview();

        const notes = [];
        if (failed.length) notes.push(`Nicht gefunden: ${[...new Set(failed)].join(', ')}`);
        if (untranslated.length) {
            const l = currentLang.toUpperCase();
            notes.push(`Kein ${l}-Druck vorhanden (bleibt englisch): ${untranslated.join(', ')}`);
        }
        if (upgraded.length) {
            const l = currentLang.toUpperCase();
            notes.push(`Schärferen ${l}-Druck gefunden und verwendet (${[...new Set(upgraded)].length}): ` +
                       `${[...new Set(upgraded)].join(', ')}`);
        }
        if (swapped.length) {
            notes.push(`Englisches Bild genutzt, weil der übersetzte Druck unscharf ist: ` +
                       `${[...new Set(swapped)].join(', ')}`);
        }        // Von Scryfall gibt es für diese Karten nur hochskalierte Scans - das ist
        // die Obergrenze des Machbaren, kein Fehler des Tools.
        const softNames = [...new Set(soft)];
        if (softNames.length) {
            notes.push(`Bester verfügbarer Scan ist trotzdem unscharf (${softNames.length}): ${softNames.join(', ')}. ` +
                       (sharpFirst ? `Auch der englische Druck ist nicht schärfer. `
                                   : `Option "Schärfe vor Sprache" aktivieren, um das englische Bild zu nutzen. `) +
                       `Alternativ über "Variante wählen" einen anderen Druck aussuchen.`);
        }
        if (rateLimitHits) {
            notes.push(`Scryfall-Limit wurde ${rateLimitHits}x erreicht - bitte erneut laden, ` +
                       `falls Karten fehlen.`);
            rateLimitHits = 0;
        }
        if (notes.length) {
            const warn = document.createElement('div');
            warn.style.cssText = 'color:#ff5d01;font-size:0.8rem;grid-column:1/-1;line-height:1.5;';
            warn.innerText = notes.join('\n');
            grid.prepend(warn);
        }
    }

    function renderPreview() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = cardData.length ? '' : '<p>Keine Karten in der Vorschau.</p>';
        cardData.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <img src="${card.image}" id="main-img-${i}">
                <div class="card-actions">
                    <button class="btn-round" onclick="removeCard(${i})">−</button>
                    <button class="btn-art" onclick="openArtPicker(${i})">VARIANTE</button>
                    <button class="btn-round" onclick="duplicateCard(${i})">+</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function duplicateCard(i) {
        const newCard = JSON.parse(JSON.stringify(cardData[i]));
        cardData.splice(i + 1, 0, newCard);
        renderPreview();
    }

    function removeCard(i) {
        cardData.splice(i, 1);
        renderPreview();
    }

    async function openArtPicker(index) {
        currentEditIndex = index;
        const card = cardData[index];
        const modal = document.getElementById('artModal');
        const artGrid = document.getElementById('artSelectionGrid');
        document.getElementById('modalTitle').innerText = card.name;
        modal.style.display = "block";
        artGrid.innerHTML = "Lade Varianten...";

        try {
            const langFilter = ` lang:${currentLang}`;
            const q = card.isToken ? `!"${card.name}" is:token${langFilter}` : `!"${card.name}" unique:prints${langFilter}`;
            const data = await scryfallFetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}`);
            artGrid.innerHTML = "";
            if (!data || !data.data || !data.data.length) {
                artGrid.innerHTML = `Keine Varianten in dieser Sprache (${currentLang}) gefunden.`;
                return;
            }
            // Scharfe Scans zuerst anzeigen - das ist die für den Druck relevante Reihenfolge
            data.data.sort((a, b) => (b.image_status === 'highres_scan') - (a.image_status === 'highres_scan'));
            data.data.forEach(print => {
                const uris = print.image_uris || print.card_faces[0].image_uris;
                const imgUrl = uris.normal;
                const hiResUrl = uris.png || uris.large || uris.normal;
                const sharp = print.image_status === 'highres_scan';
                const container = document.createElement('div');
                container.className = 'art-option-container';
                container.title = sharp ? 'Scharfer Scan - für den Druck geeignet'
                                        : 'Nur hochskalierter Scan - im Druck unscharf';
                container.innerHTML = `<img src="${imgUrl}">` +
                    `<div class="apply-all-overlay">ALT+KLICK: Alle</div>` +
                    `<div style="position:absolute;top:4px;left:4px;padding:1px 5px;border-radius:4px;` +
                    `font-size:0.6rem;font-weight:700;background:${sharp ? '#1a7f37' : '#b35309'};color:#fff;">` +
                    `${sharp ? 'SCHARF' : 'UNSCHARF'}</div>`;
                container.style.position = 'relative';
                container.onclick = (e) => {
                    if (e.altKey) applyToAll(card.name, imgUrl, hiResUrl, print.id, card.originalSearchName, print.image_status);
                    else selectArt(imgUrl, hiResUrl, print.id, card.originalSearchName, print.image_status);
                };
                artGrid.appendChild(container);
            });
        } catch (e) { artGrid.innerHTML = "Fehler beim Laden."; }
    }

    function selectArt(url, hiResUrl, id, originalName, imageStatus) {
        cardData[currentEditIndex].image = url;
        cardData[currentEditIndex].highResImage = hiResUrl;
        cardData[currentEditIndex].id = id;
        cardData[currentEditIndex].imageStatus = imageStatus;
        preferredArts[originalName] = id;
        localStorage.setItem('mtg_preferred_arts', JSON.stringify(preferredArts));
        document.getElementById(`main-img-${currentEditIndex}`).src = url;
        closeModal();
    }

    function applyToAll(name, imageUrl, hiResUrl, id, originalName, imageStatus) {
        cardData.forEach(card => {
            if (card.name === name) {
                card.image = imageUrl;
                card.highResImage = hiResUrl;
                card.id = id;
                card.imageStatus = imageStatus;
            }
        });
        preferredArts[originalName] = id;
        localStorage.setItem('mtg_preferred_arts', JSON.stringify(preferredArts));
        renderPreview();
        closeModal();
    }

    function closeModal() { document.getElementById('artModal').style.display = "none"; }

    async function generatePDF() {
        if (cardData.length === 0) return;
        const status = document.getElementById('status-bar');
        const label = document.getElementById('status-label');
        const fill = document.getElementById('status-fill');
        const btn = document.getElementById('dlBtn');
        status.style.display = "block";
        btn.disabled = true;
        fill.style.width = "0%";

        const setProgress = (done, total, text) => {
            fill.style.width = `${Math.round((done / total) * 100)}%`;
            label.innerText = text;
        };

        try {
            const lossless = document.getElementById('quality').value === 'lossless';

            // ---- Phase 1: Alle Bilder in maximaler Auflösung laden (dedupliziert) ----
            const urls = [...new Set(cardData.map(c => c.highResImage || c.image))];
            const ready = new Map();   // url -> einzubettendes Bild fuer diesen Lauf
            let loaded = 0, totalBytes = 0;
            setProgress(0, 1, `Lade ${urls.length} Bilder in Druckqualität...`);

            for (const url of urls) {
                let img = await fetchOriginalImage(url);
                if (!img) img = await fallbackImage(url);
                if (img && !lossless) img = await toJpeg(url, img);
                if (img) {
                    ready.set(url, img);
                    totalBytes += img.bytes;
                }
                loaded++;
                setProgress(loaded, urls.length + cardData.length,
                    `Lade Bilder in Druckqualität: ${loaded}/${urls.length} (${(totalBytes/1048576).toFixed(1)} MB)`);
            }

            // ---- Phase 2: PDF zusammensetzen ----
            const { jsPDF } = window.jspdf;
            const format = document.getElementById('pageSize').value;
            const is5x7 = format === '5x7';

            // Einheit mm, damit die echte Kartengroesse exakt getroffen wird.
            // Offizielle Magic-Kartengroesse: 63 x 88 mm (2.5 x 3.5 Zoll waeren
            // 63.5 x 88.9 mm und damit spuerbar zu gross).
            const CARD_W = 63, CARD_H = 88;
            // 5x7 Zoll Fotopapier = 127 x 177.8 mm, A4 = 210 x 297 mm
            const pageW = is5x7 ? 127 : 210, pageH = is5x7 ? 177.8 : 297;

            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: is5x7 ? [pageW, pageH] : 'a4',
                compress: false
            });

            const w = CARD_W, h = CARD_H, cols = is5x7 ? 2 : 3, rows = is5x7 ? 2 : 3;
            const perPage = cols * rows;
            // Raster exakt auf der Seite zentrieren (sauberes Schneiden)
            const marginX = (pageW - cols * w) / 2;
            const marginY = (pageH - rows * h) / 2;

            for (let i = 0; i < cardData.length; i++) {
                const url = cardData[i].highResImage || cardData[i].image;
                const img = ready.get(url);
                // DPI bezogen auf die tatsaechliche Druckbreite von 63 mm
                const dpi = img && img.width ? ` @ ${Math.round(img.width / (CARD_W / 25.4))} DPI` : '';
                setProgress(urls.length + i, urls.length + cardData.length,
                    `PDF wird erstellt: ${i + 1}/${cardData.length}${dpi} - ${cardData[i].name}`);
                // Rendering-Pause, damit der Fortschrittsbalken sichtbar mitlaeuft
                if (i % 3 === 0) await new Promise(r => requestAnimationFrame(r));

                if (i > 0 && i % perPage === 0) doc.addPage();
                const pIdx = i % perPage;
                const x = marginX + (pIdx % cols) * w;
                const y = marginY + Math.floor(pIdx / cols) * h;

                if (!img) continue;
                // alias = url -> identische Bilder werden nur einmal eingebettet.
                // 'SLOW' = verlustfreie zlib-Kompression (Stufe 9) für PNG,
                // nachweislich pixelidentisch zu 'NONE', aber ca. 4x kleiner.
                // Bei JPEG wird der Datenstrom unverändert durchgereicht (DCTDecode).
                doc.addImage(img.dataUrl, img.format, x, y, w, h, url, 'SLOW');
            }

            fill.style.width = "100%";
            label.innerText = "PDF wird gespeichert...";
            await new Promise(r => setTimeout(r, 50));

            // Timestamp Generierung (YYMMDD_HHMM)
            const now = new Date();
            const ts = now.toISOString().slice(2,10).replace(/-/g, '') + "_" +
                       now.getHours().toString().padStart(2, '0') +
                       now.getMinutes().toString().padStart(2, '0');

            const userTitle = document.getElementById('fileNameInput').value.trim() || 'Proxies';
            doc.save(`${ts}_${userTitle}.pdf`);
        } catch (e) {
            label.innerText = "Fehler: " + e.message;
            await new Promise(r => setTimeout(r, 3000));
        } finally {
            status.style.display = "none";
            btn.disabled = false;
        }
    }

    // Cache: identische Bilder (z.B. 4x dieselbe Karte) werden nur einmal geladen.
    const hiResCache = new Map();
    const jpegCache = new Map();

    // Wandelt das verlustfreie PNG in ein JPEG mit 95% Qualität um.
    // Die Auflösung (und damit die 300 DPI) bleibt unverändert - reduziert wird
    // nur die Dateigröße, typischerweise auf etwa ein Zehntel.
    // Wichtig: Scryfall-PNGs haben transparente, abgerundete Ecken. JPEG kennt
    // keine Transparenz, deshalb wird zuerst weiß hinterlegt - sonst würden die
    // Ecken beim Druck schwarz.
    async function toJpeg(url, img) {
        if (jpegCache.has(url)) return jpegCache.get(url);
        if (img.format === 'JPEG') return img;
        try {
            const res = await fetch(img.dataUrl);
            const bmp = await createImageBitmap(await res.blob());
            const c = document.createElement('canvas');
            c.width = bmp.width; c.height = bmp.height;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(bmp, 0, 0);
            bmp.close();
            const dataUrl = c.toDataURL('image/jpeg', 0.95);
            const out = {
                dataUrl,
                format: 'JPEG',
                // Base64 ist ca. 4/3 der Rohgröße
                bytes: Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75),
                width: c.width, height: c.height
            };
            jpegCache.set(url, out);
            return out;
        } catch (e) {
            return img; // im Zweifel lieber verlustfrei als gar nicht
        }
    }

    // Lädt die Original-Bilddatei byte-genau von Scryfall. Es findet KEINE
    // Neukodierung über ein Canvas statt - die PNG-Datei landet unverändert
    // im PDF, das ist die maximal mögliche Qualität.
    async function fetchOriginalImage(url) {
        if (hiResCache.has(url)) return hiResCache.get(url);
        try {
            // Kein Cache-Buster: die Scryfall-URLs sind bereits versioniert (?<timestamp>)
            const res = await fetch(url, { mode: 'cors', cache: 'force-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            const dataUrl = await new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = reject;
                fr.readAsDataURL(blob);
            });
            const result = {
                dataUrl,
                format: blob.type === 'image/png' ? 'PNG' : 'JPEG',
                bytes: blob.size,
                width: 0, height: 0
            };
            try {
                const bmp = await createImageBitmap(blob);
                result.width = bmp.width; result.height = bmp.height;
                bmp.close();
            } catch (e) { /* Dimensionen sind nur fuer die DPI-Anzeige noetig */ }
            hiResCache.set(url, result);
            return result;
        } catch (e) {
            return null;
        }
    }

    // Notfall-Fallback, falls fetch blockiert wird: über <img>+Canvas als PNG
    // (verlustfrei, aber mit Farbraum-Konvertierung durch den Browser).
    function fallbackImage(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth; c.height = img.naturalHeight;
                c.getContext('2d').drawImage(img, 0, 0);
                resolve({ dataUrl: c.toDataURL('image/png'), format: 'PNG', bytes: 0,
                          width: img.naturalWidth, height: img.naturalHeight });
            };
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }


</script>
